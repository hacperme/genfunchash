name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create Release
    runs-on: windows-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Extract tag name
      id: tag_name
      shell: pwsh
      run: |
        $tag = $env:GITHUB_REF -replace '^refs/tags/'
        "TAG_NAME=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag_name.outputs.TAG_NAME }}
        release_name: GenFuncHash ${{ steps.tag_name.outputs.TAG_NAME }}
        body: |
          # GenFuncHash ${{ steps.tag_name.outputs.TAG_NAME }}
          
          ## What's New
          - See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md) for detailed changes
          
          ## Installation
          
          ### Pre-built Binaries
          Download the appropriate binary for your platform from the assets below.
          
          ### From Source
          ```bash
          cargo install --git https://github.com/${{ github.repository }} --tag ${{ steps.tag_name.outputs.TAG_NAME }}
          ```
          
          ### Usage
          ```bash
          # Single function hash
          genfunchash -f "func1"
          
          # Batch processing
          genfunchash -i functions.txt -o hash_table.c
          ```
          
          ## Checksums
          Checksums for all release assets are provided in the `checksums.txt` file.

        draft: false
        prerelease: false

  build-and-upload:
    name: Build and Upload Release Assets
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: genfunchash.exe
            asset_name: genfunchash-windows-x86_64.exe

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    # No Linux musl tools needed on Windows-only releases

    - name: Cache cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

    - name: Build release binary
      run: cargo build --release --target ${{ matrix.target }}

    # No strip step on Windows

    - name: Create archive (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        $releaseDir = "target/${{ matrix.target }}/release"
        $zipPath = "${{ matrix.asset_name }}.zip"
        Compress-Archive -Path "$releaseDir/${{ matrix.artifact_name }}" -DestinationPath $zipPath -Force

    - name: Generate checksum (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        (Get-FileHash -Algorithm SHA256 "${{ matrix.asset_name }}.zip").Hash | Out-File -FilePath "${{ matrix.asset_name }}.zip.sha256" -Encoding ascii

    - name: Upload release asset (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: ./${{ matrix.asset_name }}.zip
        asset_name: ${{ matrix.asset_name }}.zip
        asset_content_type: application/zip

    - name: Upload checksum (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: ./${{ matrix.asset_name }}.zip.sha256
        asset_name: ${{ matrix.asset_name }}.zip.sha256
        asset_content_type: text/plain

  publish-crate:
    name: Publish to crates.io
    needs: create-release
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-publish-${{ hashFiles('**/Cargo.lock') }}

    - name: Publish to crates.io
      run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}